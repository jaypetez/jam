name = "jam"
main = "worker.js"
compatibility_date = "2025-06-01"

[durable_objects]
bindings = [
  { name = "ROOM", class_name = "Room" },
  { name = "HUB",  class_name = "Hub"  },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Hub"]

