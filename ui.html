<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#0b0d12">
<title>jam</title>
<style>
:root{--tind:38px;--bg:#0b0d12;--panel:#12151c;--panel2:#171b24;--line:#222735;--line2:#2c3344;--fg:#e7e9ef;--dim:#8a92a6;--dim2:#5d6578;--me:#7c9cf5;--ai:#86d68a;--sec:#4fd6c8;--warn:#f0b860;--err:#f27a8a;--ok:#5fd3a1;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;--r:12px;--side:272px}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--me)}button{font:inherit}
.app{display:flex;height:100%;height:100dvh}
/* ── sidebar ── */
aside{width:var(--side);flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px 12px}

.brand b{font-size:16px;letter-spacing:.01em}.brand .room.edit{cursor:pointer}.brand .room.edit:hover{color:var(--fg)}.brand .room{color:var(--dim);font-family:var(--mono);font-size:15px;font-weight:700;text-decoration:underline;margin-left:auto;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
section{padding:10px 18px;border-top:1px solid var(--line)}

section h4::after{content:"▾";margin-left:auto;color:var(--sec);opacity:.75;font-size:18px;line-height:1;letter-spacing:0}section h4:hover::after{opacity:1}
section.fold h4{margin:0}section.fold h4::after{content:"▸"}section.fold>:not(h4){display:none}
.foldall{width:18px;height:18px;flex:none;padding:0;display:grid;place-items:center;background:none;border:1px solid var(--line2);border-radius:4px;color:var(--sec);font-size:14px;line-height:1;cursor:pointer}.foldall:hover{border-color:var(--sec)}
section h4 .cnt{color:var(--dim);font-weight:500;letter-spacing:0;text-transform:none}section h4 .cnt:not(:empty)::before{content:"["}section h4 .cnt:not(:empty)::after{content:"]"}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.on{color:var(--ok)}.pill.off{color:var(--err)}.pill.run{color:var(--warn)}.pill.run::before{animation:pulse 1s infinite}
.pill.q::before{display:none}
.work{font-family:var(--mono);font-size:12px;letter-spacing:.06em;background:linear-gradient(90deg,#4a5266 0%,#4a5266 30%,#ffffff 50%,#4a5266 70%,#4a5266 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 1.6s ease-in-out infinite alternate}
@keyframes sweep{from{background-position:100% 0}to{background-position:0% 0}}
.pill.run{border-color:#3a3f4d}.pill.run::before{display:none}
@keyframes pulse{50%{opacity:.2}}
.person{display:flex;align-items:center;gap:10px;padding:5px 0}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#0b0d12;flex:none}
/* everyone in People is connected right now (the panel is presence-only), so every name reads as online: green + bold. You stay teal so you can still find yourself. */
.person .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--ok);text-shadow:0 0 8px #5fd3a159}.person .nm.me{color:var(--me);text-shadow:0 0 8px #7c9cf559}

.badge.owner{color:var(--warn);border-color:#4a3f2a}.badge.viewer{color:var(--dim2)}
.person .kick{background:none;border:none;color:var(--err);cursor:pointer;font-size:16px;font-weight:bold;line-height:1;padding:2px 4px;margin-left:4px;flex:none}.person .kick:hover{color:#ff4444}
.dots i{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--dim);margin-left:2px;animation:blink 1s steps(2) infinite}.dots i:nth-child(2){animation-delay:.33s}.dots i:nth-child(3){animation-delay:.66s}

.meBar button{background:none;border:0;color:var(--dim2);cursor:pointer;margin-left:auto;font-size:12px}.meBar button:hover{color:var(--fg)}
/* ── main ── */
.mainCol{flex:1;display:flex;flex-direction:column;min-width:0}
header.top{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}

.wrap{max-width:clamp(940px,82%,1500px);margin:0 auto;display:flex;flex-direction:column;gap:14px}

.say .body{background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:var(--r);white-space:pre-wrap;word-wrap:break-word}
.ai .av{background:linear-gradient(135deg,var(--ai),#5fd3a1)}

.body p{margin:.35em 0}.body pre{background:#07090d;border:1px solid var(--line);padding:10px 12px;border-radius:8px;overflow-x:auto;font:13px/1.45 var(--mono)}
.body code{font-family:var(--mono);font-size:13px;background:#07090d;padding:1px 5px;border-radius:4px;border:1px solid var(--line)}.body pre code{background:none;padding:0;border:0}
.body ul,.body ol{margin:.3em 0;padding-left:1.4em}.body h3{font-size:15px;margin:.8em 0 .2em}.body hr{border:0;border-top:1px solid var(--line);margin:.6em 0}
.cursor::after{content:"▍";color:var(--ai);animation:blink 1s steps(2) infinite}
.tool{margin-left:38px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:13px;overflow:hidden}
.tool .hd{display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;color:var(--dim);font-family:var(--mono);font-size:12px}
.tool .hd:hover{background:var(--panel2)}.tool .hd b{color:var(--fg);font-weight:600;font-family:var(--sans);font-size:12px}.tool .hd .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}

.tool .st{flex:none;font-size:11px}.tool .st.err{color:var(--err)}.tool .st.ok{color:var(--ok)}
.tool .bd{display:none;border-top:1px solid var(--line);padding:8px 10px;font:12px/1.45 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto;background:#07090d}
.tool.open .bd{display:block}.tool .bd .lbl{color:var(--dim2);font-family:var(--sans);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:6px 0 3px}.tool .bd .lbl:first-child{margin-top:0}

.tgrp .now{font:11.5px var(--mono);color:var(--dim2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tgrp .now b{color:var(--dim);font-weight:500}
.tgrp .bar{height:3px;border-radius:3px;background:var(--line);overflow:hidden}.tgrp .bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--me),var(--ok));box-shadow:0 0 8px rgba(95,211,161,.5);transition:width .35s ease}

.tgrp.few>.gh{display:none}.tgrp.few>.gb{display:flex;border-top:0;padding:0}.tgrp.few{margin-left:38px;border:0;background:none;box-shadow:none;overflow:visible}.tgrp.few>.gb>.tool:first-child{margin-top:0}
.tool .bd .del{color:#f7a1ab;background:#2a1418;display:block}.tool .bd .add{color:#a6e3a1;background:#12261a;display:block}
.sys{text-align:center;color:var(--dim2);font-size:12px}
.err .body{border:1px solid #4a2a33;color:var(--err);background:#1d1218;border-radius:var(--r);padding:10px 14px;white-space:pre-wrap}
.appr{margin-left:38px;border:1px solid #4a3f2a;background:#1a1610;border-radius:var(--r);padding:10px 14px}
.appr .t{font-size:13px;color:var(--warn);font-weight:600;display:flex;gap:8px;align-items:center}.appr pre{margin:6px 0;font:12px/1.45 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--fg);max-height:200px;overflow:auto}
.appr .acts{display:flex;gap:8px;margin-top:6px}.appr .acts button{border-radius:8px;padding:6px 14px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);cursor:pointer}.appr .acts .ok{background:var(--ok);color:#0b0d12;border-color:transparent;font-weight:600}.appr .acts .no{color:var(--err)}
.appr.done{opacity:.75;border-color:var(--line)}.appr.done.allowed .t{color:var(--ok)}.appr.done.denied .t{color:var(--err)}
#pendingBar{margin:0 0 0 var(--tind)}

.act{margin:0 0 8px var(--tind);display:none;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);font-size:13px}

select.sel{width:100%;min-width:200px;background:var(--bg);color:var(--fg);border:1px solid var(--line2);border-radius:9px;padding:7px 10px;font:inherit;font-size:13px;margin-top:6px}
.mrow{display:block;margin-top:10px;font-size:12px;color:var(--dim)}.mrow .sel{margin-top:4px}
.queue{margin:0 0 6px var(--tind);display:none;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--dim)}.queue.show{display:flex}

.cwrap{max-width:clamp(940px,82%,1500px);margin:0 auto}
